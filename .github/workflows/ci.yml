name: CI

# This machine has no Node, so CI is the safety net (v1 lesson): typecheck +
# build both apps, and run backend migrations + tests against real Postgres.
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: church
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: church_hub
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://church:secret@localhost:5432/church_hub
      JWT_ACCESS_SECRET: ci-access-secret-ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret-ci-refresh-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      # npm install (not ci): no committed lockfile yet - the author's machine has
      # no Node. First green run: commit the generated package-lock.json and switch
      # this back to `npm ci` for reproducible installs (v1 lesson).
      - run: npm install --no-audit --no-fund
      # Work around npm optional-dependencies bug (npm/cli#4828): npm can skip
      # Rollup's platform-specific native binary, which Vite/Vitest then fail to
      # load ("Cannot find module @rollup/rollup-linux-x64-gnu"). Install the
      # binary matching the resolved Rollup version. The runner is always linux-x64.
      - run: |
          ver=$(node -p "require('rollup/package.json').version" 2>/dev/null || true)
          if [ -n "$ver" ]; then npm install --no-save --no-audit --no-fund "@rollup/rollup-linux-x64-gnu@$ver"; fi
      - run: npm run typecheck
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm test
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      # Same Rollup native-binary workaround as the backend job (npm/cli#4828).
      - run: |
          ver=$(node -p "require('rollup/package.json').version" 2>/dev/null || true)
          if [ -n "$ver" ]; then npm install --no-save --no-audit --no-fund "@rollup/rollup-linux-x64-gnu@$ver"; fi
      - run: npm run typecheck
      - run: npm run build
