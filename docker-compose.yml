# Local dev/one-box. In prod, deploy backend + frontend as Container Apps in the
# SAME region as the database (v1 lesson: never split app and DB across regions).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: church
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: church_hub
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U church']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgres://church:secret@postgres:5432/church_hub
      JWT_ACCESS_SECRET: dev-access-secret-change-me
      JWT_REFRESH_SECRET: dev-refresh-secret-change-me
      CORS_ORIGINS: http://localhost:3000
    ports: ['8080:8080']

  frontend:
    build: ./frontend
    depends_on: [backend]
    environment:
      NODE_ENV: production
    ports: ['3000:3000']

volumes:
  pgdata:
